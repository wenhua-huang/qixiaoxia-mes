# 集成测试配置
# 数据源由 BaseIntegrationTest 通过 @DynamicPropertySource 动态注入
# Redis 连接本地 Docker Redis（由 docker compose up -d redis 启动）

# 项目配置
ruoyi:
  name: 企小侠MES-TEST
  version: 3.9.2
  copyrightYear: 2026
  profile: /tmp/qixiaoxia-mes-test/uploadPath
  addressEnabled: false
  captchaType: math

server:
  port: 0

# Redis — 连接本地 Docker (docker compose up -d redis)
spring:
  flyway:
    # Testcontainers DB 非空（SQL init + manual_tables 建所有表——manual_tables 已含 V61-V136 之后的最终结构，
    # 若 baseline 过低会重放 ALTER 型迁移（如 V73 加列）而 Duplicate column 失败）。
    # baselineVersion=136：只跑 V137+。manual_tables.sql 为 V136 基线时刻的表结构快照
    # （个别高频踩坑表如 qxx_wm_outsource_order 直接对齐生产最终结构），因此 V137+ 的 ALTER 迁移必须幂等
    # （存储过程判 information_schema / CREATE TABLE IF NOT EXISTS），引用的表须在快照中存在。
    # 约束：新增非幂等 ALTER 型迁移时，目标表须在 manual_tables.sql 中（或抬高此 baseline）；
    # 全新建表迁移用 CREATE TABLE IF NOT EXISTS 即可，无需调整。
    baseline-on-migrate: true
    baseline-version: 136
    repair-before-migrate: true
  datasource:
    druid:
      # 借出连接前验证，防止 Spring SQL init 后连接被标记为 disabled
      # 导致 Flyway 报 "connection disabled" → "Unable to determine 'foreign_key_checks'"
      testOnBorrow: true
      validationQuery: SELECT 1
      testWhileIdle: true
      # 延长超时，避免长时间 SQL 初始化期间连接超时
      socketTimeout: 120000
      connectTimeout: 60000
  data:
    redis:
      host: localhost
      port: 6380
      password: qxx123456
      database: 0
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 4
          max-active: 4
          max-wait: -1ms

# Token 配置
token:
  header: Authorization
  secret: abcdefghijklmnopqrstuvwxyz
  expireTime: 30

# 日志（测试时降低噪音）
logging:
  level:
    com.ruoyi: warn
    org.springframework: warn
    org.testcontainers: info
    org.apache.ibatis: warn

# MyBatis
mybatis:
  typeAliasesPackage: com.ruoyi.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc (测试时关闭)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 防盗链（测试时关闭）
referer:
  enabled: false

# XSS（测试时关闭）
xss:
  enabled: false
  excludes: ''
  urlPatterns: ''

# MinIO（测试时关闭）
minio:
  enabled: false
