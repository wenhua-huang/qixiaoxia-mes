## 生产 nginx 配置权威副本
## 服务器路径：/etc/nginx/conf.d/qixiaoxia-mes.conf
## 修改后要 `nginx -t && nginx -s reload`
##
## location 优先级（nginx 前缀 location 最长匹配）：
##   /app/prod-api/  →  剥前缀反代后端，兜住 uni-app H5 自动加 /app/ 前缀的相对路径（图片 <image src="/prod-api/xxx"> 会变 /app/prod-api/xxx）
##   /app/           →  移动端 H5 SPA（alias），fallback 到 /app/index.html
##   /prod-api/      →  PC 前端 API 代理
##   /               →  PC 前端 SPA，fallback 到 /index.html
##
## 修改 location 数量/顺序前先看 skill 排查表；改错可能导致 app 图片裂开或 API 404。
server {
    listen 80;
    server_name localhost 172.16.99.21;

    client_max_body_size 20m;
    root /var/www/qixiaoxia-mes/frontend/dist;

    # Frontend - static files (production build)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 禁止缓存：文件名不带 hash，内容变更后必须让浏览器拿到最新版，
    # 否则会用缓存的旧入口引用已删除的 hash chunk（白屏/旧代码）
    location = /index.html {
        root /var/www/qixiaoxia-mes/frontend/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
    }

    # 帮助中心 SPA 路由：/help 本身是前端路由，但 dist/help/ 目录物理存在（放 markdown），
    # 若交给 location / 的 try_files 会命中目录触发 301→/help/→403。用精确匹配把 /help 钉回 index.html。
    # /help/xxx.md 等文档请求不命中本精确匹配，仍由 location / 返回静态文件。
    location = /help {
        try_files /index.html =404;
    }

    # Mobile App API proxy (uni-app H5 里 <image src="/prod-api/xxx"> 会被前缀化为 /app/prod-api/xxx；此块剥掉 /app/prod-api/ 前缀转发到后端)
    location /app/prod-api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mobile App H5
    location /app/ {
        alias /var/www/qixiaoxia-mes/app/dist/;
        try_files $uri $uri/ /app/index.html;
    }

    # app index.html 同样禁止缓存（uni-app H5 入口文件名固定）
    location = /app/index.html {
        alias /var/www/qixiaoxia-mes/app/dist/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
    }

    # Backend API
    location /prod-api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
